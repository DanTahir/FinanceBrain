# Local development stack. Production uses infra/docker-compose.prod.yml.
services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: fb-falkordb
    ports:
      - "127.0.0.1:6379:6379"   # Redis protocol (local only)
      - "127.0.0.1:3001:3000"   # FalkorDB Browser UI
    environment:
      # run.sh passes REDIS_ARGS to redis-server and FALKORDB_ARGS to the graph module.
      REDIS_ARGS: "--appendonly yes --appendfsync everysec --requirepass ${FB_FALKORDB_PASSWORD:-devpassword}"
      FALKORDB_ARGS: "MAX_QUEUED_QUERIES 200 TIMEOUT_DEFAULT 15000 TIMEOUT_MAX 60000 RESULTSET_SIZE 10000"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${FB_FALKORDB_PASSWORD:-devpassword}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  falkordb-data:
