[project]
name = "financebrain"
version = "0.1.0"
description = "FalkorDB-backed multi-agent company brain for a synthetic finance firm (Graph Hacks 2026)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "falkordb>=1.1",
  "redis>=5.0",
  "openai>=1.50",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  "spacy>=3.7,<4",
  "faker>=28",
  "mcp>=1.2",
  "cryptography>=43",
  "boto3>=1.35",
  "orjson>=3.10",
  "tenacity>=9.0",
  "python-dotenv>=1.0",
  "en-core-web-md",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
